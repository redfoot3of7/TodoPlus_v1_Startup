<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TodoPlus Help</title>
</head>
<body>
    <h1>Welcome to TodoPlus</h1>
    <p>This is a simple Todo application. Here's what you can do:</p>

    <h2>1. Main Screen</h2>
    <p>The main screen displays your list of tasks.</p>
    <img src="images/help_main_screen.png" alt="Main screen" width="300" />

    <h2>2. Editing a Task</h2>
    <p>Tap the pencil icon to edit a task's title or due date.</p>
    <img src="images/help_edit_screen.png" alt="Edit screen" width="300" />

    <h2>3. Sorting Your List</h2>
    <p>You can sort tasks by due date or name using the dropdown.</p>
    <img src="images/help_sorting.png" alt="Sorting help" width="300" />
</body>
</html>
